name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for this job so the test workflow only inherits the
    # (read-only) permissions declared above.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: checkout code
      uses: actions/checkout@v6

    - uses: astral-sh/setup-uv@v7

    - name: Install locked build dependencies
      run: uv sync --locked --only-group build

    - name: Build wheel and sdist
      run: |
          uv build --no-build-isolation --wheel --sdist
          rm dist/.gitignore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: "dist/*"

    - name: upload release artifacts
      uses: actions/upload-artifact@v6
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error

    - name: Prepare release metadata
      run: |
        echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Create or update GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

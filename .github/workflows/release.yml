name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

# Kept read-only because the reusable test workflow inherits these. Jobs which
# need write access declare it themselves.
permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_name: ${{ steps.release-metadata.outputs.release_name }}
      is_prerelease: ${{ steps.release-metadata.outputs.is_prerelease }}

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"

    - name: Prepare release metadata
      id: release-metadata
      run: |
        release_name=${GITHUB_REF_NAME#v}
        package_version=$(tr -d '\n' < VERSION.txt)
        if [ "$release_name" != "$package_version" ]; then
          echo "tag version $release_name does not match package version $package_version" >&2
          exit 1
        fi

        is_prerelease=false
        if [[ "$release_name" =~ (^|[0-9._-])(a|alpha|b|beta|c|rc|pre|preview)[._-]?[0-9]+([.+-]|$)|\.dev[0-9]+([.+-]|$) ]]; then
          is_prerelease=true
        fi

        echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
        echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

    - name: Build wheel and sdist
      run: |
          uv build --wheel --sdist --build-constraint build-constraints.txt --require-hashes
          rm dist/.gitignore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/*"

    - name: upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error

  publish:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This single environment approval guards both pypi + GitHub releases.
    # It also identifies the job to the trusted publisher configured on pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/mjml
    permissions:
      contents: write
      id-token: write

    steps:
    - name: download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: "release-artifacts"
        path: dist

    # Immutable releases freeze their assets at publication, so attach the
    # artifacts to a draft first. Publish that draft only after the PyPI upload
    # step completes successfully.
    - name: Create draft GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ needs.artifacts.outputs.release_name }}
        prerelease: ${{ needs.artifacts.outputs.is_prerelease }}
        draft: true
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish pypi release
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

    - name: Publish GitHub release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ github.ref_name }}
        prerelease: ${{ needs.artifacts.outputs.is_prerelease }}
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

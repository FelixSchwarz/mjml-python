name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for this job so the test workflow only inherits the
    # (read-only) permissions declared above.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "latest-known"

    - name: Build wheel and sdist
      run: |
          uv build --wheel --sdist --build-constraint build-constraints.txt --require-hashes
          rm dist/.gitignore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
      with:
        subject-path: "dist/*"

    - name: upload release artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error

    - name: Prepare release metadata
      run: |
        echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Create or update GitHub release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

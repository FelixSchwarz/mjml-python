name: Create Release Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


env:
  # query OSV for known malware before syncing
  UV_MALWARE_CHECK: "1"


jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      use_locked_dependencies: true

  artifacts:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write access only for this job so the test workflow only inherits the
    # (read-only) permissions declared above.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest-known"

    - name: Build wheel and sdist
      run: |
          uv build --wheel --sdist --build-constraint build-constraints.txt --require-hashes
          rm dist/.gitignore

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/*"

    - name: upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: "release-artifacts"
        path: dist/*
        if-no-files-found: error

    - name: Prepare release metadata
      run: |
        echo "TAG_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        echo "RELEASE_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Create or update GitHub release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_NAME }}
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

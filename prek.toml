[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", exclude = '^tests/testdata/.*\.html$' },
    { id = "end-of-file-fixer", exclude = '^tests/testdata/.*\.html$' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
    { id = "debug-statements" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3"  # frozen: v0.16.3
hooks = [
    { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
]

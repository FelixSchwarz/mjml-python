[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", exclude = '^tests/(testdata|missing_functionality)/.*\.html$' },
    { id = "end-of-file-fixer", exclude = '^tests/(testdata|missing_functionality)/.*\.html$' },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
    { id = "debug-statements" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "321478e58f4938179c6b86e4ddfa923d1547a49b"  # frozen: v0.16.6
hooks = [
    { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"] },
]
